version: "2"
sql:

  - engine: "postgresql"
    queries: "pkg/migration/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "migration"
        out: "pkg/migration"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true
        overrides:
          - db_type: "date"
            go_type: "time.Time"
