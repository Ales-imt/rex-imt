# Configuration du service rex-sync.
#
# Il maintient dans PostgreSQL le référentiel scolaire — promotions, profs,
# élèves, planning, groupes — à partir de la source amont désignée ci-dessous.
# Il ne sert aucune donnée : seuls /health et /version sont exposés.

database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  name: ${POSTGRES_DB}

server:
  host: localhost
  port: 3334

# Source du référentiel. Les deux décrivent la même base cybema et portent les
# mêmes identifiants ; seule la façon de l'atteindre change. Une source absente
# ou inconnue arrête le démarrage — se rabattre sur l'autre synchroniserait un
# référentiel différent de celui attendu, sans que personne ne s'en aperçoive.
migration:
  # webdfd : interrogation directe de cybema, au rythme fixé ci-dessous.
  # hfsql  : lecture des exports JSON déposés par le service rex-export-webdfd,
  #          pris à mesure qu'ils apparaissent.
  source: webdfd

  # Source webdfd : à quel rythme interroger cybema. Il ne signale pas ses
  # changements, il faut donc revenir le lire — mais un cycle parcourt le
  # planning de CHAQUE promotion, ce qui n'est pas gratuit pour l'amont.
  webdfd:
    # Délai entre deux cycles complets. Défaut 2h.
    interval: 1h
    # Délai après un cycle en échec (coupure réseau, cgiempt indisponible) :
    # plus court, pour ne pas attendre un cycle entier avant de retenter.
    # Défaut 5m.
    retry: 5m

  # Diagnostic : chemin d'un fichier JSON réécrit à chaque cycle avec TOUS les
  # créneaux collectés et TOUS ceux qui ont été écartés, avec leur raison.
  #
  # Sert à répondre à « le planning amont a N créneaux, la base en montre
  # moins » — les créneaux sont écartés à cinq endroits du cycle, et les logs
  # ne disent pas lesquels. Vide = désactivé, ce qui est l'état normal :
  # l'activer mémorise chaque rejet le temps du cycle.
  #
  # Le répertoire est créé au besoin, MAIS le service tourne sous un compte non
  # privilégié (`rex`) : il ne peut rien créer sous /var/lib, qui appartient à
  # root. Viser /opt/rex-sync/…, que l'image donne à `rex`, ou un volume monté
  # en écriture. Récupération : docker cp rex-sync:<chemin> .
  dumpPlanning: ""

  # Source hfsql : où lire les exports. Le répertoire est monté en LECTURE
  # SEULE — la rétention appartient au producteur, pas à ce service.
  hfsql:
    data: /var/lib/rex/hfsql/data
    # Fréquence de recherche d'un nouvel export. Une sauvegarde arrive au plus
    # une fois par jour : parcourir un répertoire chaque minute ne coûte rien.
    interval: 1m

# Source webdfd : cybema interrogé en direct.
webdfd:
  baseURL: http://webdfd.mines-ales.fr/cybema/cgi-bin/cgiempt.exe
  listeGroupeURL: http://webdfd.mines-ales.fr/cybema/cgi-bin/cgihtml.exe
