database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  name: ${POSTGRES_DB}

mariaDB:
  host:     ${MARIADB_HOST}
  port:     ${MARIADB_PORT}
  user:     ${MARIADB_USER}
  password: ${MARIADB_PASSWORD}
  database: ${MARIADB_DB}

server:
  host: localhost
  port: 3300

jwt:
  secret: ${JWT_SECRET_ELEVE}
  accessTokenExpiresIn: 15m
  refreshTokenExpiresIn: 2160h

ldap:
#url: 	ldap://ldap.mines-ales.fr:389
  url: ldap://${LDAP_HOST}:389
  baseDN: dc=ema,dc=fr

age:
  publicKey: ${AGE_PUBLIC_KEY}

presence:
  tokenSecret: ${PRESENCE_TOKEN_SECRET}

# Source du planning : bd = public.seance, alimentée toutes les 2 h par la
# synchronisation de back-rex-admin. webdfd et aurega interrogent le système
# amont en direct et restent pleinement fonctionnels.
programme:
  source: webdfd
  webdfd:
    baseURL: http://webdfd.mines-ales.fr/cybema/cgi-bin/cgiempt.exe
  aurega:
    baseURL: ${AUREGA_BASE_URL}
    apiKey: ${AUREGA_API_KEY}

smtp:
  host: ${SMTP_HOST}
  port: ${SMTP_PORT}
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from: rex-imt-noreply@mines-ales.fr
  startTLS: false
  timeout: 10s
