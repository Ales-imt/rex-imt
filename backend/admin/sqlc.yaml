version: "2"
sql:

  - engine: "postgresql"
    queries: "pkg/user/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "user"
        out: "pkg/user"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true

  - engine: "postgresql"
    queries: "pkg/cohorte/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "cohorte"
        out: "pkg/cohorte"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true

  - engine: "postgresql"
    queries: "pkg/feedback/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "feedback"
        out: "pkg/feedback"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true

  - engine: "postgresql"
    queries: "pkg/reports/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "reports"
        out: "pkg/reports"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true

  - engine: "postgresql"
    queries: "pkg/evaluation/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "evaluation"
        out: "pkg/evaluation"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true
        overrides:
          - db_type: "float8"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Float8"

  - engine: "postgresql"
    queries: "pkg/reponse/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "gen"
        out: "pkg/reponse/gen"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true

  - engine: "postgresql"
    queries: "pkg/postit/query.sql"
    schema: "../schema.sql"
    gen:
      go:
        package: "gen"
        out: "pkg/postit/gen"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_json_tags: true