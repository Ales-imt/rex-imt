database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  name: ${POSTGRES_DB}

mariaDB:
  host:     ${MARIADB_HOST}
  port:     ${MARIADB_PORT}
  user:     ${MARIADB_USER}
  password: ${MARIADB_PASSWORD}
  database: ${MARIADB_DB}

server:
  host: localhost
  port: 3333

jwt:
  secret: ${JWT_SECRET_ADMIN}
  accessTokenExpiresIn: 15m
  refreshTokenExpiresIn: 2160h

ldap:
  #url: ldap://ldap.mines-ales.fr:389
  url: ldap://${LDAP_HOST}:389
  baseDN: dc=ema,dc=fr

ia:
  provider: rack # "ollama" ou "ragarenn" ou "rack"

  # IA local sur le host si present. Dans ce cas, le host doit être accessible depuis le container admin (docker-compose.yml).
ollama:
  baseURL: http://${OLLAMA_HOST}:11434
  model: mistral-nemo

rack:
  # IA gerer par le rack de l'IMT Mines Alès.
  # Même logiciel que ragarenn (API compatible OpenAI), mais adresse et clé
  # propres au rack, et certificat HTTPS auto-signé (voir rack.go: InsecureSkipVerify).
  baseURL: https://rag.159.31.247.5.nip.io
  model: mistral-small:latest
  apiKey: ${RACK_API_KEY}

presence:
  tokenSecret: ${PRESENCE_TOKEN_SECRET}
  planningURL: http://webdfd.mines-ales.fr/cybema/cgi-bin/cgiempt.exe
  timestamp:
    enabled: true
    urls:
      - https://freetsa.org/tsr        # valeur par défaut ; ajoutez d'autres TSA pour redondance
    hashAlgorithm: sha256
    timeout: 10s
    # L'ancrage automatique tourne toutes les heures (scheduler intégré) ;
    # aucune ancre n'est créée si la tête de chaîne n'a pas bougé.
    # Certificat racine FreeTSA — télécharger depuis https://freetsa.org/files/cacert.pem
    # et placer à cet emplacement avant de démarrer le service.
    # Il est archivé avec chaque jeton pour permettre la vérification si la TSA disparaît.
    caCertPath: ./x509/freetsa/cacert.pem
  # Témoin externe : après chaque nouvelle ancre, la tête de chaîne (seq + hash
  # + jeton RFC 3161 + cert TSA) est envoyée vers une boîte EXTERNE.
  # EXIGENCES DE DÉPLOIEMENT (voir docs/temoin-externe.md) :
  #   - la boîte destinataire doit être gérée par un rôle distinct de l'admin infra ;
  #   - le compte SMTP ci-dessous ne doit avoir QUE le droit d'envoi.
  witness:
    enabled: true                     # activer une fois la boîte tierce en place
    recipients:
      - ${WITNESS_RECIPIENT}           # ex. archive-presences@exemple-externe.org
    smtp:
      host: ${SMTP_HOST}
      port: ${SMTP_PORT}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      from: rex-imt-noreply@mines-ales.fr
      startTLS: false
      timeout: 10s

webdfd:
  baseURL: http://webdfd.mines-ales.fr/cybema/cgi-bin/cgiempt.exe
  listeGroupeURL: http://webdfd.mines-ales.fr/cybema/cgi-bin/cgihtml.exe

# Génération des bulletins : conversion docx -> PDF via le sidecar Gotenberg
# (service défini dans infras/container/compose.yaml, publié sur localhost:3000).
bullettin:
  gotenbergURL: ${GOTENBERG_URL}