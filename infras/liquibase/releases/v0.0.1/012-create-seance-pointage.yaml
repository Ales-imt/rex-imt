databaseChangeLog:

  # ---- public.seance -------------------------------------------------------
  # Schéma final d'emblée : code nullable (séances synchronisées n'ont pas
  # de code avant ouverture), colonnes de planning webdfd, cancelled_at.
  - changeSet:
      id: v0.0.1-012a-create-table-seance
      author: vjo
      changes:
        - createTable:
            tableName: seance
            schemaName: public
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: matiere_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: varchar(16)
              - column:
                  name: opened_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: closed_at
                  type: TIMESTAMPTZ
              - column:
                  name: late_after_minutes
                  type: integer
                  defaultValueNumeric: 10
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: starts_at
                  type: TIMESTAMPTZ
              - column:
                  name: ends_at
                  type: TIMESTAMPTZ
              - column:
                  name: salle
                  type: varchar(255)
              - column:
                  name: prof
                  type: varchar(255)
              - column:
                  name: promotion_id
                  type: bigint
              - column:
                  name: groupe_id
                  type: bigint
              - column:
                  name: prof_id
                  type: integer
              - column:
                  name: cancelled_at
                  type: TIMESTAMPTZ
        - addUniqueConstraint:
            tableName: seance
            schemaName: public
            columnNames: code
            constraintName: uq_seance_code
        - createIndex:
            tableName: seance
            schemaName: public
            indexName: idx_seance_matiere
            columns:
              - column:
                  name: matiere_id
        - createIndex:
            tableName: seance
            schemaName: public
            indexName: idx_seance_open
            columns:
              - column:
                  name: closed_at
        - addForeignKeyConstraint:
            baseTableName: seance
            baseTableSchemaName: public
            baseColumnNames: matiere_id
            referencedTableSchemaName: public
            referencedTableName: matiere
            referencedColumnNames: id
            constraintName: seance_matiere_id_fkey
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: seance
            baseTableSchemaName: public
            baseColumnNames: promotion_id
            referencedTableSchemaName: public
            referencedTableName: promotion
            referencedColumnNames: id
            constraintName: fk_seance_promotion
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: seance
            baseTableSchemaName: public
            baseColumnNames: groupe_id
            referencedTableSchemaName: public
            referencedTableName: groupe
            referencedColumnNames: id
            constraintName: fk_seance_groupe
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: seance
            baseTableSchemaName: public
            baseColumnNames: prof_id
            referencedTableSchemaName: public
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_seance_prof
            onDelete: SET NULL
      rollback:
        - dropTable:
            tableName: seance
            schemaName: public

  # ---- public.pointage ----------------------------------------------------
  - changeSet:
      id: v0.0.1-012b-create-table-pointage
      author: vjo
      changes:
        - createTable:
            tableName: pointage
            schemaName: public
            columns:
              - column:
                  name: seance_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: statut
                  type: text
                  defaultValue: PRESENT
                  constraints:
                    nullable: false
              - column:
                  name: pointe_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: pointage
            schemaName: public
            columnNames: seance_id, user_id
            constraintName: pk_pointage
        - createIndex:
            tableName: pointage
            schemaName: public
            indexName: idx_pointage_user
            columns:
              - column:
                  name: user_id
        - addForeignKeyConstraint:
            baseTableName: pointage
            baseTableSchemaName: public
            baseColumnNames: seance_id
            referencedTableSchemaName: public
            referencedTableName: seance
            referencedColumnNames: id
            constraintName: pointage_seance_id_fkey
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: pointage
            baseTableSchemaName: public
            baseColumnNames: user_id
            referencedTableSchemaName: public
            referencedTableName: user
            referencedColumnNames: id
            constraintName: pointage_user_id_fkey
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: pointage
            schemaName: public
