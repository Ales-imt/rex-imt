databaseChangeLog:
- changeSet:
    id: feedback-notify-trigger-1
    author: vjo
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE OR REPLACE FUNCTION notify_new_feedback()
          RETURNS trigger AS $func$
          DECLARE
            v_promotion varchar(255);
          BEGIN
            SELECT s.promotion INTO v_promotion
            FROM student s
            WHERE s.user_id = NEW.user_id;

            PERFORM pg_notify(
              'new_feedback',
              json_build_object(
                'id',        NEW.id,
                'content',   NEW.content,
                'user_id',   NEW.user_id,
                'season_id', NEW.season_id,
                'promotion', v_promotion
              )::text
            );
            RETURN NEW;
          END;
          $func$ LANGUAGE plpgsql;

          CREATE TRIGGER feedback_notify
          AFTER INSERT ON feedback
          FOR EACH ROW EXECUTE FUNCTION notify_new_feedback();
    rollback:
    - sql:
        splitStatements: false
        sql: |
          DROP TRIGGER IF EXISTS feedback_notify ON feedback;
          DROP FUNCTION IF EXISTS notify_new_feedback();
