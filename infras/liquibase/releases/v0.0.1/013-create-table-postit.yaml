databaseChangeLog:
- changeSet:
    id: create-table-postit-1
    author: vjo
    changes:
    - createTable:
        tableName: postit
        columns:
        - column:
            name: id
            type: SERIAL
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: message_id
            type: TEXT
            constraints:
              nullable: false
              foreignKeyName: fk_postit_feedback
              references: feedback(message_id)
              deleteCascade: true
        - column:
            name: texte
            type: TEXT
            constraints:
              nullable: false
        - column:
            name: auteur_id
            type: INTEGER
            constraints:
              nullable: false
              foreignKeyName: fk_postit_user
              references: user(id)
              deleteCascade: false
        - column:
            name: cree_le
            type: TIMESTAMPTZ
            defaultValueComputed: now()
            constraints:
              nullable: false
    rollback:
    - dropTable:
        tableName: postit
