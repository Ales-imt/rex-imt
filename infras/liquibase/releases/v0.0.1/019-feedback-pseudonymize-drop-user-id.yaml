databaseChangeLog:

  # =============================================================
  # CHANGESET 001 — Remplir pseudo à partir de l'id
  # Secret éphémère généré une seule fois pour le batch,
  # jamais persisté. Même id → même pseudo.
  # =============================================================
  - changeSet:
      id: 017-feedback-fill-pseudo
      author: vjo
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                v_salt TEXT := gen_random_uuid()::text;
              BEGIN
                UPDATE feedback
                SET pseudo = md5(user_id::text || v_salt)
                WHERE pseudo IS NULL;
              END $$;
      rollback:
        - sql:
            sql: UPDATE feedback SET pseudo = NULL;

  # =============================================================
  # CHANGESET 002 — Suppression de user_id
  # Exécuté uniquement après que pseudo soit rempli
  # =============================================================
  - changeSet:
      id: 017-feedback-drop-user-id
      author: vjo
      changes:
        - dropColumn:
            tableName: feedback
            columnName: user_id
      rollback:
        - addColumn:
            tableName: feedback
            columns:
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: true
