databaseChangeLog:
  - changeSet:
      id: v0.0.2-016-create-table-matiere
      author: vjo
      changes:
        - createTable:
            tableName: matiere
            schemaName: public
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: periode_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: annee
                  type: integer
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: matiere
            schemaName: public
            columnNames: external_id, annee
            constraintName: uq_matiere_external_id_annee
        - addForeignKeyConstraint:
            baseTableName: matiere
            baseTableSchemaName: public
            baseColumnNames: periode_id
            referencedTableName: periode
            referencedTableSchemaName: public
            referencedColumnNames: id
            constraintName: matiere_periode_id_fkey
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: eval_session
            baseTableSchemaName: public
            baseColumnNames: matiere_id
            referencedTableName: matiere
            referencedTableSchemaName: public
            referencedColumnNames: id
            constraintName: eval_session_matiere_id_fkey
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: eval_synthese_ia
            baseTableSchemaName: public
            baseColumnNames: matiere_id
            referencedTableName: matiere
            referencedTableSchemaName: public
            referencedColumnNames: id
            constraintName: eval_synthese_ia_matiere_id_fkey
            onDelete: CASCADE
      rollback:
        - sql:
            sql: ALTER TABLE eval_synthese_ia DROP CONSTRAINT IF EXISTS eval_synthese_ia_matiere_id_fkey
        - sql:
            sql: ALTER TABLE eval_session DROP CONSTRAINT IF EXISTS eval_session_matiere_id_fkey
        - sql:
            sql: ALTER TABLE matiere DROP CONSTRAINT IF EXISTS matiere_periode_id_fkey
        - dropTable:
            tableName: matiere
            schemaName: public
