                ('PEU_DISPONIBLE',     'AMBIANCE', 'NEGATIF',  'Peu disponible',        1),
                ('RYTHME_IMPOSE',      'AMBIANCE', 'NEGATIF',  'Rythme imposé',         2),
                ('PEU_ECOUTE',         'AMBIANCE', 'NEGATIF',  'Peu à l''écoute',       3)
              ;