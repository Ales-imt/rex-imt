databaseChangeLog:
  - changeSet:
      id: v0.0.2-003-create-table-annee-academique
      author: vjo
      changes:
        - createTable:
            tableName: annee_academique
            schemaName: public
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: libelle
                  type: text
              - column:
                  name: debut
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: fin
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: annee_academique
            schemaName: public
