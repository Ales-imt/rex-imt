databaseChangeLog:
  - changeSet:
      id: v0.0.2-004-create-table-promotion
      author: vjo
      changes:
        - createTable:
            tableName: promotion
            schemaName: public
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
      rollback:
        - dropTable:
            tableName: promotion
            schemaName: public
