databaseChangeLog:
  - changeSet:
      id: v0.0.1-009-feedback-fk-cascade
      author: vjo
      changes:
        - dropForeignKeyConstraint:
            baseTableName: feedback
            baseTableSchemaName: public
            constraintName: feedback_student_id_fkey
        - addForeignKeyConstraint:
            baseTableName: feedback
            baseTableSchemaName: public
            baseColumnNames: user_id
            referencedTableName: user
            referencedTableSchemaName: public
            referencedColumnNames: id
            constraintName: feedback_student_id_fkey
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: feedback
            baseTableSchemaName: public
            constraintName: feedback_student_id_fkey
        - addForeignKeyConstraint:
            baseTableName: feedback
            baseTableSchemaName: public
            baseColumnNames: user_id
            referencedTableName: user
            referencedTableSchemaName: public
            referencedColumnNames: id
            constraintName: feedback_student_id_fkey

  - changeSet:
      id: v0.0.1-009-student-fk-cascade
      author: vjo
      changes:
        - dropForeignKeyConstraint:
            baseTableName: student
            baseTableSchemaName: public
            constraintName: elo_student_user_id_fkey
