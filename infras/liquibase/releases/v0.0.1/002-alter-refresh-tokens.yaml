databaseChangeLog:
  - changeSet:
      id: v0.0.1-002-alter-refresh-tokens
      author: vjo
      changes:
        - addColumn:
            tableName: refresh_tokens
            schemaName: public
            columns:
              - column:
                  name: token_version
                  type: integer
                  defaultValueNumeric: 1
              - column:
                  name: session
                  type: text
                  defaultValue: ""
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: refresh_tokens
            schemaName: public
            columnName: token_version
        - dropColumn:
            tableName: refresh_tokens
            schemaName: public
            columnName: session
