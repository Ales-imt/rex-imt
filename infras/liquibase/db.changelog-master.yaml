# lancer 
#   cd infras/liquibase && liquibase changelogSync
# pour creer l'historique des migrations

# pour les roolback:
#   liquibase rollback --tag=v0.0.0

databaseChangeLog:
  - includeAll:
      path: releases/v0.0.0
      relativeToChangelogFile: false
  - includeAll:
      path: releases/v0.0.1
      relativeToChangelogFile: false


