---
app_name: admin
server_name: vecu-etudiant-admin-2.mines-ales.fr
ssl_dir: "/etc/ssl/{{ server_name }}"
container_name: rex-admin
container_image: ghcr.io/ales-imt/rex-admin:latest
container_port: 8121
app_dir: /home/userdfx/rex-admin
config_dest_in_container: /opt/rex-admin/conf/config.yaml
freetsa_cert_container_path: /opt/rex-admin/conf/x509/freetsa/cacert.pem

# Génération des bulletins en PDF : sidecar Gotenberg (conversion docx -> PDF).
# Activé par défaut (voir templates). Gotenberg publie son port sur l'hôte ;
# l'app admin le joint via host.containers.internal:3000 (GOTENBERG_URL).
gotenberg_container_name: gotenberg
gotenberg_image: docker.io/gotenberg/gotenberg:8
gotenberg_port: 3000

postgres_host: "{{ postgres_host }}"
postgres_port: "{{ postgres_port }}"
postgres_db: "{{ postgres_db }}"
mariadb_host: "{{ mariadb_host }}"
mariadb_port: "{{ mariadb_port }}"
mariadb_database: "{{ mariadb_database }}"
ldap_host: "{{ ldap_host }}"

jwt_secret: "{{ jwt_secret_admin }}"
