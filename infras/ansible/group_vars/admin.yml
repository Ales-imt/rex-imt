---
# Variables de l'HÔTE admin — elles s'appliquent à TOUS les plays qui ciblent
# `hosts: admin`, c'est-à-dire admin, sync ET export-webdfd, qui partagent cette
# VM. N'y mettre que ce qui vaut pour les trois.
#
# Tout ce qui décrit le seul service rex-admin (container_name, container_port,
# app_dir, Gotenberg…) vit dans vars/admin.yml, chargé par `vars_files` dans
# playbook-admin.yml : sans quoi ces valeurs fuiraient vers les plays sync et
# export-webdfd, qui devraient les neutraliser une à une.
#
# Les accès PostgreSQL / MariaDB / LDAP ne sont pas repris ici : ils viennent du
# vault (vault-vars.yml, chargé en vars_files ET en --extra-vars par le
# makefile), qui prime de toute façon sur group_vars. Les redéfinir donnerait
# des lignes `postgres_host: "{{ postgres_host }}"` jamais évaluées.

server_name: vecu-etudiant-admin-2.mines-ales.fr
ssl_dir: "/etc/ssl/{{ server_name }}"
