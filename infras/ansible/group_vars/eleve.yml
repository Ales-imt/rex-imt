---
app_name: eleve
server_name: vecu-etudiant-eleves-2.mines-ales.fr
ssl_dir: "/etc/ssl/{{ server_name }}"
container_name: rex-eleve
container_image: ghcr.io/ales-imt/rex-eleve:latest
container_port: 8131
app_dir: /home/userdfx/rex-eleve
config_dest_in_container: /opt/rex-eleve/conf/config.yaml

postgres_host: "{{ postgres_host }}"
postgres_port: "{{ postgres_port }}"
postgres_db: "{{ postgres_db }}"
mariadb_host: "{{ mariadb_host }}"
mariadb_port: "{{ mariadb_port }}"
mariadb_database: "{{ mariadb_database }}"
ldap_host: "{{ ldap_host }}"

jwt_secret: "{{ jwt_secret_eleve }}"

age_public_key: "{{ age_public_key }}"

# Pas de génération de bulletins côté élève : Gotenberg désactivé (opt-out du
# défaut activé), pour ne pas déployer un conteneur inutile sur la VM élève.
gotenberg_enabled: false
