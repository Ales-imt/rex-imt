name: imt-rex
services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      rex-net:
        ipv4_address: 10.20.1.2
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Décommenter pour activer le GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        OLLAMA_HOST=http://ollama:11434 ollama pull mistral-nemo
      "
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - rex-net
    restart: "no"

  db:
    image: postgres:16.10-alpine
    container_name: postgres-16.10-alpine-rex
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      rex-net:
        ipv4_address: 10.20.1.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap-rex
    restart: always
    environment:
      LDAP_ORGANISATION: "IMT Mines Ales"
      LDAP_DOMAIN: "ema.fr"
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
    networks:
      rex-net:
        ipv4_address: 10.20.1.5
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=ema,dc=fr", "-w", "adminpassword", "-b", "dc=ema,dc=fr"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mariadb:
    image: mariadb:latest
    container_name: mariadb-rex
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DB}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      rex-net:
        ipv4_address: 10.20.1.6
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ollama-data:
  openldap-data:
  openldap-config:
  mariadb-data:

networks:
  rex-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.1.0/24
